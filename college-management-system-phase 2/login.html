<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login | CampusCore</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eff6ff,#f8fafc);">
    <section style="width:min(100%,460px);background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:34px;box-shadow:0 20px 55px rgba(15,23,42,.1);">
      <a class="brand" href="index.html">
        <span class="brand-mark"><i class="fa-solid fa-building-columns"></i></span>
        <span><strong>Campus<span>Core</span></strong><small>College Management System</small></span>
      </a>
      <div style="margin-top:30px;">
        <span class="eyebrow">Secure portal access</span>
        <h1 style="font-size:2.35rem;margin:10px 0;">Welcome back</h1>
        <p>Frontend login foundation. Production authentication will be handled by PHP sessions and server-side RBAC.</p>
      </div>
      <form id="login-form" style="margin-top:25px;">
        <label for="role" style="display:block;font-weight:700;margin-bottom:7px;">Portal role</label>
        <select id="role" required style="width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:15px;">
          <option value="">Select role</option>
          <option value="STUDENT_ADMIN">Student Administration</option>
          <option value="FACULTY_ADMIN">Faculty Administration</option>
          <option value="CR_ADMIN">Class Representative</option>
          <option value="COUNCIL_ADMIN">Student Council</option>
          <option value="CRC_ADMIN">CRC</option>
        </select>
        <label for="username" style="display:block;font-weight:700;margin-bottom:7px;">Username / Email</label>
        <input id="username" type="text" required autocomplete="username" style="width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:15px;">
        <label for="password" style="display:block;font-weight:700;margin-bottom:7px;">Password</label>
        <input id="password" type="password" required autocomplete="current-password" style="width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;">
        <button class="btn btn-primary" style="width:100%;margin-top:20px;" type="submit">Continue <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p id="login-message" role="status" style="margin-top:15px;font-size:.82rem;"></p>
      <a class="text-link" style="margin-top:12px;" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
    </section>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", event => {
      event.preventDefault();
      document.getElementById("login-message").textContent =
        "Development mode: no real authentication is performed yet. PHP session authentication will be added in the backend phase.";
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js" defer></script>
</body>
</html>
